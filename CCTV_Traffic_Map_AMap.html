
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">

<title>Hong Kong CCTV Vehicle Detection Map</title>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    color: #243447;
    background: #f5f7fa;
}

.header {
    padding: 18px 25px;
    background: white;
    border-bottom: 1px solid #ddd;
}

.header h2 {
    margin: 0 0 8px 0;
}

.header p {
    margin: 0;
    color: #667085;
    font-size: 14px;
}

#map {
    width: 100%;
    height: 680px;
}

.info-window {
    width: 310px;
    max-height: 430px;
    overflow-y: auto;
    font-family: Arial, sans-serif;
    font-size: 13px;
    line-height: 1.5;
}

.info-window h3 {
    margin: 0 0 8px 0;
    color: #1677c8;
}

.info-window h4 {
    margin: 12px 0 5px 0;
}

.info-window table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 6px;
}

.info-window th,
.info-window td {
    padding: 5px;
    border: 1px solid #ddd;
    text-align: left;
}

.info-window th {
    background: #f0f3f7;
}

.camera-summary {
    background: #f2f7fc;
    padding: 8px;
    border-radius: 5px;
    margin-top: 8px;
}

.footer {
    padding: 15px 25px;
    background: white;
    color: #667085;
    font-size: 12px;
}

</style>

<!-- AMap security configuration MUST be declared before loading the API -->
<script>
window._AMapSecurityConfig = {
    securityJsCode: "548d06a2c3430ebc8a0ed95e07a0e0a6"
};
</script>

<!-- AMap JavaScript API -->
<script src="https://webapi.amap.com/maps?v=2.0&key=63d5cf88ebd8e329c38ca1e7a97e9123"></script>

</head>

<body>

<div class="header">

    <h2>Hong Kong CCTV Vehicle Detection Map</h2>

    <p>
        Interactive map showing the locations of three selected CCTV cameras
        and their YOLO-based vehicle detection results.
        Click a camera marker to view detailed information.
    </p>

</div>

<div id="map"></div>

<div class="footer">
    Data source: Hong Kong Traffic Department CCTV cameras.
    Vehicle detection: YOLO11.
</div>


<script>

// Camera information generated by Python
const cameraData = [{"id": "H904F", "region": "Hong Kong Island", "district": "Wan Chai", "location": "Canal Road Flyover near Gloucester Road [H904F]", "lat": 22.2793944, "lon": 114.1813669, "valid_images": 5, "average_cars": 87.6, "average_motorcycles": 0.0, "average_buses": 6.0, "average_trucks": 6.2, "average_total": 99.8, "rounds": [{"Round": 1, "Scheduled_Offset": 0, "Capture_Time": "2026-11-11 19:40:03", "Delay": 1.54, "Status": "Success", "Vehicles": {"Cars": 83, "Motorcycles": 0, "Buses": 8, "Trucks": 10, "Total": 101}}, {"Round": 2, "Scheduled_Offset": 120, "Capture_Time": "2026-11-11 19:42:02", "Delay": 1.29, "Status": "Success", "Vehicles": {"Cars": 97, "Motorcycles": 0, "Buses": 10, "Trucks": 2, "Total": 109}}, {"Round": 3, "Scheduled_Offset": 240, "Capture_Time": "2026-11-11 19:44:01", "Delay": 0.11, "Status": "Success", "Vehicles": {"Cars": 71, "Motorcycles": 0, "Buses": 5, "Trucks": 10, "Total": 86}}, {"Round": 4, "Scheduled_Offset": 360, "Capture_Time": "2026-11-11 19:46:01", "Delay": 0.1, "Status": "Success", "Vehicles": {"Cars": 59, "Motorcycles": 0, "Buses": 2, "Trucks": 5, "Total": 66}}, {"Round": 5, "Scheduled_Offset": 480, "Capture_Time": "2026-11-11 19:48:02", "Delay": 1.28, "Status": "Success", "Vehicles": {"Cars": 128, "Motorcycles": 0, "Buses": 5, "Trucks": 4, "Total": 137}}]}, {"id": "H222F", "region": "Hong Kong Island", "district": "Wan Chai", "location": "Gloucester Road near Sun Hung Kai Center [H222F]", "lat": 22.27971054, "lon": 114.1765444, "valid_images": 5, "average_cars": 144.8, "average_motorcycles": 1.0, "average_buses": 4.6, "average_trucks": 8.2, "average_total": 158.6, "rounds": [{"Round": 1, "Scheduled_Offset": 0, "Capture_Time": "2026-11-11 19:40:03", "Delay": 1.73, "Status": "Success", "Vehicles": {"Cars": 126, "Motorcycles": 3, "Buses": 2, "Trucks": 5, "Total": 136}}, {"Round": 2, "Scheduled_Offset": 120, "Capture_Time": "2026-11-11 19:42:03", "Delay": 1.45, "Status": "Success", "Vehicles": {"Cars": 204, "Motorcycles": 0, "Buses": 5, "Trucks": 8, "Total": 217}}, {"Round": 3, "Scheduled_Offset": 240, "Capture_Time": "2026-11-11 19:44:01", "Delay": 0.22, "Status": "Success", "Vehicles": {"Cars": 166, "Motorcycles": 0, "Buses": 9, "Trucks": 5, "Total": 180}}, {"Round": 4, "Scheduled_Offset": 360, "Capture_Time": "2026-11-11 19:46:01", "Delay": 0.2, "Status": "Success", "Vehicles": {"Cars": 113, "Motorcycles": 0, "Buses": 5, "Trucks": 11, "Total": 129}}, {"Round": 5, "Scheduled_Offset": 480, "Capture_Time": "2026-11-11 19:48:03", "Delay": 1.44, "Status": "Success", "Vehicles": {"Cars": 115, "Motorcycles": 2, "Buses": 2, "Trucks": 12, "Total": 131}}]}, {"id": "K614F", "region": "Kowloon", "district": "Kwun Tong", "location": "Lung Cheung Road/Clear Water Bay Road [K614F]", "lat": 22.33399946, "lon": 114.20849, "valid_images": 5, "average_cars": 62.6, "average_motorcycles": 0.0, "average_buses": 2.0, "average_trucks": 4.6, "average_total": 69.2, "rounds": [{"Round": 1, "Scheduled_Offset": 0, "Capture_Time": "2026-11-11 19:40:03", "Delay": 1.85, "Status": "Success", "Vehicles": {"Cars": 86, "Motorcycles": 0, "Buses": 1, "Trucks": 5, "Total": 92}}, {"Round": 2, "Scheduled_Offset": 120, "Capture_Time": "2026-11-11 19:42:03", "Delay": 1.56, "Status": "Success", "Vehicles": {"Cars": 28, "Motorcycles": 0, "Buses": 2, "Trucks": 2, "Total": 32}}, {"Round": 3, "Scheduled_Offset": 240, "Capture_Time": "2026-11-11 19:44:02", "Delay": 0.73, "Status": "Success", "Vehicles": {"Cars": 32, "Motorcycles": 0, "Buses": 2, "Trucks": 2, "Total": 36}}, {"Round": 4, "Scheduled_Offset": 360, "Capture_Time": "2026-11-11 19:46:02", "Delay": 0.7, "Status": "Success", "Vehicles": {"Cars": 73, "Motorcycles": 0, "Buses": 5, "Trucks": 6, "Total": 84}}, {"Round": 5, "Scheduled_Offset": 480, "Capture_Time": "2026-11-11 19:48:03", "Delay": 1.55, "Status": "Success", "Vehicles": {"Cars": 94, "Motorcycles": 0, "Buses": 0, "Trucks": 8, "Total": 102}}]}];


// Initialize AMap
const map = new AMap.Map("map", {

    zoom: 12,

    center: [114.17, 22.30],

    viewMode: "2D"

});


// Add map controls
AMap.plugin(
    ["AMap.Scale", "AMap.ToolBar"],
    function() {

        map.addControl(new AMap.Scale());

        map.addControl(new AMap.ToolBar());

    }
);


// Create markers and information windows
const markers = [];

cameraData.forEach(function(camera) {

    const position = [
        camera.lon,
        camera.lat
    ];


    // Create camera marker
    const marker = new AMap.Marker({

        position: position,

        title: camera.id,

        offset: new AMap.Pixel(-13, -30),

        label: {
            content: camera.id,
            direction: "top",
            offset: new AMap.Pixel(0, -5)
        }

    });


    // Build round-by-round detection table
    let roundRows = "";

    camera.rounds.forEach(function(round) {

        const v = round.Vehicles;

        roundRows += `
            <tr>
                <td>${round.Round}</td>
                <td>${round.Capture_Time}</td>
                <td>${round.Status}</td>
                <td>${v.Cars}</td>
                <td>${v.Motorcycles}</td>
                <td>${v.Buses}</td>
                <td>${v.Trucks}</td>
                <td>${v.Total}</td>
            </tr>
        `;

    });


    // Information window content
    const content = `

        <div class="info-window">

            <h3>${camera.id}</h3>

            <b>Location Information</b>

            <p>
                <b>District:</b> ${camera.district}<br>

                <b>Region:</b> ${camera.region}<br>

                <b>Location:</b> ${camera.location}<br>

                <b>Latitude:</b> ${camera.lat}<br>

                <b>Longitude:</b> ${camera.lon}
            </p>


            <div class="camera-summary">

                <h4>Vehicle Detection Summary</h4>

                <b>Successful detection images:</b>
                ${camera.valid_images}<br>

                <b>Average cars:</b>
                ${camera.average_cars}<br>

                <b>Average motorcycles:</b>
                ${camera.average_motorcycles}<br>

                <b>Average buses:</b>
                ${camera.average_buses}<br>

                <b>Average trucks:</b>
                ${camera.average_trucks}<br>

                <b>Average total vehicles:</b>
                ${camera.average_total}

            </div>


            <h4>Round-by-round Results</h4>

            <table>

                <thead>
                    <tr>
                        <th>Round</th>
                        <th>Time</th>
                        <th>Status</th>
                        <th>Cars</th>
                        <th>Moto</th>
                        <th>Bus</th>
                        <th>Truck</th>
                        <th>Total</th>
                    </tr>
                </thead>

                <tbody>
                    ${roundRows}
                </tbody>

            </table>

        </div>

    `;


    // Create information window
    const infoWindow = new AMap.InfoWindow({

        content: content,

        offset: new AMap.Pixel(0, -30),

        isCustom: false

    });


    // Open information window when marker is clicked
    marker.on("click", function() {

        infoWindow.open(map, marker.getPosition());

    });


    map.add(marker);

    markers.push(marker);

});


// Automatically adjust map view to include all cameras
map.setFitView(markers, false, [80, 80, 80, 80]);

</script>

</body>
</html>
